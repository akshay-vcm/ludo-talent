  background:
   radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,transparent),radial-gradient(1.5px 1.5px at 82% 12%,#fff8 50%,transparent),
   radial-gradient(1px 1px at 70% 80%,#fff9 50%,transparent),radial-gradient(1.5px 1.5px at 22% 86%,#fff7 50%,transparent),

/* board */
#wrap{position:relative;width:var(--B);height:var(--B)}

.isl{border-radius:calc(var(--u)*.35);background:var(--island);box-shadow:0 calc(var(--u)*.22) 0 var(--dirt),0 calc(var(--u)*.3) 10px #0004}

  box-shadow:inset 0 0 0 2px #ffffff55}
.bridge{position:absolute;width:calc(var(--u)*.8);height:calc(var(--u)*.42);transform:translate(-50%,-50%);border-radius:4px;
  background:repeating-linear-gradient(90deg,var(--wood) 0 30%,var(--woodD) 30% 34%);box-shadow:0 3px 0 var(--woodD);pointer-events:none}
.bridge.v{transform:translate(-50%,-50%) rotate(90deg)}
/* things on squares */
.it{position:absolute;inset:10%;display:grid;place-items:center;animation:float 1.6s ease-in-out infinite;
  filter:drop-shadow(0 0 4px #fff59a) drop-shadow(0 2px 1px #0005)}

@keyframes blink{50%{opacity:.2}}

/* tokens */
#tokens{position:absolute;inset:0;pointer-events:none}
.tk{position:absolute;width:calc(var(--u)*.86);height:calc(var(--u)*1.12);transform:translate(-50%,-80%);

@keyframes hop{50%{transform:translate(-50%,-92%)}}

  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}

@media (prefers-reduced-motion:reduce){.it,.bigdie.go,.bigdie.spin,.tk.can,.cell.pick::before{animation:none}.tk{transition:none}}

/* overlays */
.ov{position:fixed;inset:0;background:#0a1a4099;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.card{background:var(--card);color:var(--cardInk);border-radius:20px;padding:20px;width:min(92vw,400px);max-height:92svh;overflow:auto}
.card h1{margin:0 0 6px;font-size:28px;letter-spacing:-.5px}
.card h2{font-size:15px;margin:16px 0 8px}
.card p{margin:0;color:var(--cardMuted);font-size:14px;line-height:1.45}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--chip);background:var(--chip);border-radius:10px;padding:9px 0;font-weight:800}
.seg button.sel{border-color:var(--cardInk)}
.seat{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.seat i{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
.seat input{flex:1;min-width:0;border:none;background:var(--chip);border-radius:9px;padding:9px;font:inherit;color:inherit}
.seat button{border-radius:9px;padding:9px 10px;background:var(--chip);min-width:104px;font-size:14px}
.tog{display:flex;align-items:center;gap:10px;font-size:14px}
.tog input{width:20px;height:20px}
.start{width:100%;margin-top:18px;padding:14px;font-size:17px;font-weight:800;border-radius:14px;background:#22b14c;color:#fff;box-shadow:0 4px 0 #157a33}
.start:disabled{opacity:.5;cursor:default}

<body>
<button id="menu">New game</button>
<div class="row" id="topRow"></div>
<div id="wrap"><div id="board"></div><div id="tokens"></div></div>
<div class="row" id="botRow"></div>
<div id="msg" aria-live="polite"></div>
<script>
/* ---------- geometry ---------- */
const TRACK=[];const P=(r,c)=>TRACK.push([r,c]);
for(let c=1;c<=5;c++)P(6,c);
for(let r=5;r>=0;r--)P(r,6);
P(0,7);
for(let r=0;r<=5;r++)P(r,8);
for(let c=9;c<=14;c++)P(6,c);
P(7,14);
for(let c=14;c>=9;c--)P(8,c);
for(let r=9;r<=14;r++)P(r,8);
P(14,7);
for(let r=14;r>=9;r--)P(r,6);
for(let c=5;c>=0;c--)P(8,c);
P(7,0);P(6,0);

const COLORS=[
  {key:'blue',name:'Blue',css:'var(--blue)',dark:'var(--blueD)'},
  {key:'red',name:'Red',css:'var(--red)',dark:'var(--redD)'},
  {key:'green',name:'Green',css:'var(--green)',dark:'var(--greenD)'},
  {key:'yellow',name:'Yellow',css:'var(--yellow)',dark:'var(--yellowD)'}];
const HOME=[
  [1,2,3,4,5].map(c=>[7,c]),
  [1,2,3,4,5].map(r=>[r,7]),
  [13,12,11,10,9].map(c=>[7,c]),
  [13,12,11,10,9].map(r=>[r,7])];
const SAFE=new Set([0,8,13,21,26,34,39,47]);
const YARD=[[0,0],[9,0],[9,9],[0,9]];           // x,y of yard corner
const SPOTS=[[2,2],[4,2],[2,4],[4,4]];
const FINISH=[[6.8,7.5],[7.5,6.8],[8.2,7.5],[7.5,8.2]];
const MIN_PER_TYPE=1,MAX_PER_TYPE=4, MAX_HELD=3, STEP=150;
let SPEED=1;
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
const $=id=>document.getElementById(id);

/* ---------- state ---------- */
let S=null, cfg={n:4,seats:[
  {name:'',type:'human'},{name:'',type:'human'},{name:'',type:'human'},{name:'',type:'human'}],items:true};

function seatColors(n){return n===2?[0,2]:n===3?[0,1,2]:[0,1,2,3];}
function newGame(){
  const cols=seatColors(cfg.n);
  S={players:cols.map((c,i)=>({color:c,name:(cfg.seats[c].name||'').trim()||COLORS[c].name,
      type:cfg.seats[c].type,uid:cfg.seats[c].uid||null,tokens:[-1,-1,-1,-1],dice:0,fence:0,done:false})),
     gameId:Math.random().toString(36).slice(2),
     turn:0,phase:'roll',roll:null,chosen:false,sixes:0,fenceUsed:false,
     items:{},fences:{},moves:[],winners:[],msg:'',itemsOn:cfg.items};
  refreshItems('dice');refreshItems('fence');buildBoard();turnStart();
}
const cur=()=>S.players[S.turn];
const cellOf=(p,prog)=>(p.color*13+prog)%52;

function tokenXY(p,ti){
  const g=p.tokens[ti];
  if(g<0){const[bx,by]=YARD[p.color],[sx,sy]=SPOTS[ti];return[bx+sx,by+sy];}
  if(g<=50){const[r,c]=TRACK[cellOf(p,g)];return[c+.5,r+.5];}
  if(g<=55){const[r,c]=HOME[p.color][g-51];return[c+.5,r+.5];}
  return FINISH[p.color];
}
function occupied(idx){
  return S.players.some(p=>p.tokens.some(g=>g>=0&&g<=50&&cellOf(p,g)===idx));
}
// Items of one type stay put until one of them is collected; then that whole type is re-scattered
// with a new random count (it can go up or down).
function refreshItems(type){
  if(!S.itemsOn)return;
  for(const k in S.items)if(S.items[k]===type)delete S.items[k];
  const n=MIN_PER_TYPE+Math.floor(Math.random()*(MAX_PER_TYPE-MIN_PER_TYPE+1));
  let placed=0,tries=0;
  while(placed<n&&tries++<300){
    const idx=Math.floor(Math.random()*52);
    if(SAFE.has(idx)||S.items[idx]||S.fences[idx]!==undefined||occupied(idx))continue;
    S.items[idx]=type;placed++;
  }
}

/* ---------- rules ---------- */
function simulate(pi,ti,v){
  const p=S.players[pi],g=p.tokens[ti];
  if(g===56)return null;
  if(g===-1)return v===6?{path:[0],fenceHit:null}:null;
  if(g+v>56)return null;
  const path=[];let fenceHit=null;
  for(let s=g+1;s<=g+v;s++){
    if(s<=50){const idx=cellOf(p,s),f=S.fences[idx];
      if(f!==undefined&&f!==pi){fenceHit=idx;break;}}
    path.push(s);
  }
  return {path,fenceHit};
}
function validMoves(pi,v){
  const out=[];
  S.players[pi].tokens.forEach((_,ti)=>{const sim=simulate(pi,ti,v);if(sim)out.push({ti,sim});});
  return out;
}
const finalOf=(pi,m)=>m.sim.path.length?m.sim.path[m.sim.path.length-1]:S.players[pi].tokens[m.ti];
function capturesAt(pi,idx){
  if(SAFE.has(idx))return 0;let n=0;
  S.players.forEach((q,qi)=>{if(qi!==pi)q.tokens.forEach(g=>{if(g>=0&&g<=50&&cellOf(q,g)===idx)n++;});});
  return n;
}

function turnStart(){
  S.phase='roll';S.roll=null;S.chosen=false;S.fenceUsed=false;S.moves=[];
  render();
  if(cur().type==='cpu')botTurn();
}
function nextTurn(bonus){
  if(S.phase==='over')return;
  if(!bonus||cur().done){
    S.sixes=0;
    do{S.turn=(S.turn+1)%S.players.length;}while(cur().done);
  }
  turnStart();
}

async function doRoll(){
  if(S.phase!=='roll')return;
  S.phase='anim';S.rolling=true;
  for(let k=0;k<6;k++){S.roll=1+Math.floor(Math.random()*6);render();await sleep(55);}
  S.rolling=false;const v=1+Math.floor(Math.random()*6);
  S.roll=v;S.chosen=false;cur().last=v;
  if(v===6){S.sixes++;
    if(S.sixes===3){S.msg='Three sixes in a row, turn lost.';render();await sleep(1100);S.msg='';nextTurn(false);return;}
  }else S.sixes=0;
  afterValue();
}
function chooseValue(v){
  if(S.phase!=='choose')return;
  cur().dice--;S.roll=v;S.chosen=true;cur().last=v;S.phase='anim';afterValue();
}
async function afterValue(){
  const pi=S.turn,moves=validMoves(pi,S.roll);
  if(!moves.length){S.msg='No move possible.';render();await sleep(1000);S.msg='';nextTurn(false);return;}
  S.moves=moves;S.phase='move';render();
  if(cur().type==='cpu'){await sleep(450);const m=botPick(pi,moves);doMove(pi,m.ti,m.sim);return;}
  const distinct=new Set(moves.map(m=>cur().tokens[m.ti]));
  if(distinct.size===1){await sleep(380);if(S.phase==='move'&&S.turn===pi)doMove(pi,moves[0].ti,moves[0].sim);}
}
async function doMove(pi,ti,sim){
  if(S.phase!=='move')return;
  S.phase='anim';S.moves=[];S.msg='';
  const p=S.players[pi],notes=[];
  for(const s of sim.path){
    p.tokens[ti]=s;render();await sleep(STEP);
  }
  // items are only collected when the move ENDS exactly on them
  const end=p.tokens[ti];
  if(end>=0&&end<=50){const idx=cellOf(p,end),it=S.items[idx];
    if(it){delete S.items[idx];
      if(it==='dice'){if(p.dice<MAX_HELD)p.dice++;notes.push('collected a dice card');}
      else{if(p.fence<MAX_HELD)p.fence++;notes.push('collected a fence');}
      refreshItems(it);render();}}
  if(sim.fenceHit!==null){
    const owner=S.players[S.fences[sim.fenceHit]];
    delete S.fences[sim.fenceHit];notes.push(`stopped by ${owner.name}'s fence and broke it`);render();await sleep(250);
  }
  let bonus=false;const g=p.tokens[ti];
  if(g<=50){const idx=cellOf(p,g);
    if(!SAFE.has(idx)){S.players.forEach((q,qi)=>{if(qi===pi)return;
      q.tokens.forEach((t,k)=>{if(t>=0&&t<=50&&cellOf(q,t)===idx){q.tokens[k]=-1;bonus=true;notes.push(`captured ${q.name}`);}});});}}
  if(g===56){bonus=true;notes.push('brought a token home');}
  if(S.roll===6&&!S.chosen)bonus=true;
  if(!p.done&&p.tokens.every(t=>t===56)){p.done=true;S.winners.push(pi);notes.push('finished!');}
  const left=S.players.filter(q=>!q.done);
  if(notes.length)S.msg=`${p.name} ${[...new Set(notes)].join(', ')}.`;
  render();
  if(left.length<=1){if(left.length)S.winners.push(S.players.indexOf(left[0]));S.phase='over';render();await sleep(500);showWin();return;}
  await sleep(notes.length?650:200);
  nextTurn(bonus);
}

/* fence */
function canFence(idx){return !SAFE.has(idx)&&!S.items[idx]&&S.fences[idx]===undefined&&!occupied(idx);}
function placeFence(idx){
  if(S.phase!=='fence'||!canFence(idx))return;
  S.fences[idx]=S.turn;cur().fence--;S.fenceUsed=true;S.phase='roll';
  S.msg=`${cur().name} placed a fence.`;render();
}

/* ---------- computer player ---------- */
function botScore(pi,m){
  const p=S.players[pi],g=p.tokens[m.ti],f=finalOf(pi,m);let sc=f-g;
  if(f===56)sc+=100;
  if(g===-1)sc+=55;
  if(g<=50&&f>50)sc+=35;
  if(f<=50){const idx=cellOf(p,f);
    sc+=capturesAt(pi,idx)*90;
    if(S.items[idx])sc+=22;
    if(SAFE.has(idx))sc+=18;
    else{S.players.forEach((q,qi)=>{if(qi===pi)return;q.tokens.forEach(t=>{
      if(t>=0&&t<=50){const d=(idx-cellOf(q,t)+52)%52;if(d>=1&&d<=6)sc-=28;}});});}}
  if(m.sim.fenceHit!==null)sc-=8;
  return sc+Math.random()*3;
}
function botPick(pi,moves){return moves.reduce((a,b)=>botScore(pi,b)>botScore(pi,a)?b:a);}
async function botTurn(){
  const pi=S.turn;await sleep(550);
  if(S.turn!==pi||S.phase!=='roll')return;
  const p=cur();
  if(p.fence>0&&Math.random()<.7){
    let best=null;
    S.players.forEach((q,qi)=>{if(qi===pi)return;q.tokens.forEach(t=>{
      if(t>=0&&t<=46&&(!best||t>best.t))best={q,t};});});
    if(best){for(let k=1;k<=4;k++){const idx=cellOf(best.q,best.t+k);
      if(canFence(idx)){S.phase='fence';placeFence(idx);await sleep(500);break;}}}
  }
  if(p.dice>0){
    let pick=null;
    for(let v=1;v<=6&&!pick;v++)for(const m of validMoves(pi,v)){const f=finalOf(pi,m);
      if((f<=50&&capturesAt(pi,cellOf(p,f)))||(f===56&&p.tokens[m.ti]<56)){pick=v;break;}}
    if(!pick&&p.tokens.every(t=>t===-1||t===56)&&p.tokens.some(t=>t===-1))pick=6;
    if(pick){S.phase='choose';chooseValue(pick);return;}
  }
  doRoll();
}

/* ---------- rendering ---------- */
const board=$('board'),tokLayer=$('tokens'),trackCells=[],tokEls=[];
// which screen corner each colour sits in
const CORNER={0:'tl',1:'tr',2:'br',3:'bl'};
const STAR='<svg class="star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>';
const PIP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const pips=v=>[...Array(9)].map((_,k)=>`<i class="${v&&PIP[v].includes(k)?'on':''}"></i>`).join('');
const DIE_ICON='<svg viewBox="0 0 20 20"><rect x="1.5" y="1.5" width="17" height="17" rx="4.5" fill="#fff" stroke="#b9c6d4" stroke-width="1.5"/><g fill="#203a73"><circle cx="6" cy="6" r="1.7"/><circle cx="14" cy="6" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="6" cy="14" r="1.7"/><circle cx="14" cy="14" r="1.7"/></g></svg>';
const FENCE_ICON='<svg viewBox="0 0 20 20"><g stroke="#7a3f12" stroke-width="1"><rect x="2.5" y="3" width="3" height="15" rx="1" fill="#e08a3a"/><rect x="14.5" y="3" width="3" height="15" rx="1" fill="#e08a3a"/><rect x="1" y="6" width="18" height="3.4" rx="1" fill="#f0a24f"/><rect x="1" y="11.5" width="18" height="3.4" rx="1" fill="#f0a24f"/></g></svg>';
const PAWN=c=>`<svg viewBox="0 0 40 52"><ellipse cx="20" cy="48" rx="14" ry="4.5" fill="#0005"/>
 <path d="M7 45c0-7 5-13 8-16h10c3 3 8 9 8 16 0 2.5-6 4-13 4S7 47.5 7 45z" fill="${c}" stroke="#fff" stroke-width="2.5"/>
 <circle cx="20" cy="17" r="11" fill="${c}" stroke="#fff" stroke-width="2.5"/>
 <ellipse cx="16" cy="13" rx="4" ry="3" fill="#fff9"/></svg>`;

function buildBoard(){
  board.innerHTML='';tokLayer.innerHTML='';trackCells.length=0;tokEls.length=0;
  // cross-shaped island behind the track
  [['1/span 15','7/span 3'],['7/span 3','1/span 15']].forEach(([r,c])=>{const d=document.createElement('div');d.className='isl';
    d.style.cssText=`grid-row:${r};grid-column:${c}`;board.appendChild(d);});
  YARD.forEach(([x,y],c)=>{const d=document.createElement('div');d.className='isl yard';
    d.style.cssText=`grid-row:${y+1}/span 6;grid-column:${x+1}/span 6;--pc:${COLORS[c].css};--pcd:${COLORS[c].dark}`;
    d.innerHTML='<div class="nest"><b></b><b></b><b></b><b></b></div>';board.appendChild(d);});
  const ctr=document.createElement('div');ctr.className='center';ctr.style.cssText='grid-row:7/span 3;grid-column:7/span 3';board.appendChild(ctr);
  TRACK.forEach(([r,c],idx)=>{const d=document.createElement('div');d.className='cell'+((r+c)%2?' alt':'');
    d.style.gridRow=r+1;d.style.gridColumn=c+1;
    if(idx%13===0){const k=idx/13;d.classList.add('col');d.style.setProperty('--pc',COLORS[k].css);d.style.setProperty('--pcd',COLORS[k].dark);}
    if(SAFE.has(idx))d.innerHTML=STAR;
    d.onclick=()=>placeFence(idx);trackCells[idx]=d;board.appendChild(d);});
  HOME.forEach((cells,c)=>cells.forEach(([r,cc])=>{const d=document.createElement('div');d.className='cell col hc';
    d.style.cssText=`grid-row:${r+1};grid-column:${cc+1};--pc:${COLORS[c].css};--pcd:${COLORS[c].dark}`;board.appendChild(d);}));
  // wooden bridges from each nest to its start square
  [[1.5,5.9,'v'],[9.1,1.5,''],[13.5,9.1,'v'],[5.9,13.5,'']].forEach(([x,y,v])=>{const b=document.createElement('div');b.className='bridge '+v;
    b.style.left=x/15*100+'%';b.style.top=y/15*100+'%';tokLayer.appendChild(b);});
  S.players.forEach((p,pi)=>p.tokens.forEach((_,ti)=>{const b=document.createElement('button');b.className='tk';
    b.innerHTML=PAWN(COLORS[p.color].css);b.setAttribute('aria-label',`${p.name} token ${ti+1}`);
    b.onclick=()=>{const m=S.moves.find(m=>m.ti===ti);if(S.phase==='move'&&S.turn===pi&&m&&canControl(pi))doMove(pi,ti,m.sim);};
    tokEls.push({el:b,pi,ti});tokLayer.appendChild(b);}));
}

/* actions from a corner panel: only the player whose turn it is can use them */
const canControl=pi=>{const q=S.players[pi];return q.type==='human'&&(!ONLINE||q.uid===ONLINE.myId);};
const mine=pi=>S&&S.turn===pi&&canControl(pi);
function tapDie(pi){if(mine(pi)&&S.phase==='roll')doRoll();}
function tapPick(pi){if(mine(pi)&&S.phase==='roll'&&cur().dice)S.phase='choose',render();}
function tapFence(pi){if(!mine(pi))return;if(S.phase==='fence'){S.phase='roll';render();}
  else if(S.phase==='roll'&&cur().fence&&!S.fenceUsed){S.phase='fence';render();}}
function cancelMode(){if(S.phase==='choose'||S.phase==='fence'){S.phase='roll';render();}}

function cornerHTML(c){
  const pi=S.players.findIndex(p=>p.color===c),side=CORNER[c].endsWith('r')?'r':'';
  if(pi<0)return `<div class="corner ${side} empty"></div>`;
  const p=S.players[pi],on=pi===S.turn&&S.phase!=='over',human=canControl(pi);
  const home=p.tokens.filter(t=>t===56).length;
  const canAct=on&&human&&S.phase==='roll';
  const dieCls=['bigdie',on&&S.phase==='roll'&&human?'go':'',on&&S.chosen?'chosen':'',on&&S.phase==='anim'&&!S.chosen&&S.rolling?'spin':''].join(' ');
  return `<div class="corner ${side} ${p.done?'out':on?'':'idle'}" style="--pc:${COLORS[c].css}">
    <button class="${dieCls}" onclick="tapDie(${pi})" aria-label="Roll for ${esc(p.name)}" ${canAct?'':'tabindex="-1"'}>${pips(on&&S.roll?S.roll:(p.last||6))}</button>
    <div class="who">
      <div class="nm"><span class="ava">${p.type==='cpu'?'🤖':esc(p.name[0].toUpperCase())}</span>${esc(p.name)}${ONLINE&&p.uid===ONLINE.myId?' (you)':''}</div>
      <div class="inv">
        <button class="chipb ${on&&S.phase==='choose'?'live':''}" onclick="tapPick(${pi})" ${canAct&&p.dice?'':'disabled'} aria-label="Pick a number, ${p.dice} left">${DIE_ICON}${p.dice}</button>
        <button class="chipb ${on&&S.phase==='fence'?'live':''}" onclick="tapFence(${pi})" ${(canAct&&p.fence&&!S.fenceUsed)||(on&&S.phase==='fence')?'':'disabled'} aria-label="Place a fence, ${p.fence} left">${FENCE_ICON}${p.fence}</button>
      </div>
      <div class="home">🏠 ${home}/4${p.done?' · done':''}</div>
    </div></div>`;
}

function render(){
  if(!S)return;const p=cur(),human=canControl(S.turn);
  $('topRow').innerHTML=cornerHTML(0)+cornerHTML(1);
  $('botRow').innerHTML=cornerHTML(3)+cornerHTML(2);
  // squares
  trackCells.forEach((d,idx)=>{d.querySelectorAll('.it,.fn').forEach(e=>e.remove());
    if(S.fences[idx]!==undefined){const f=document.createElement('span');f.className='fn';
      f.style.setProperty('--fcol',COLORS[S.players[S.fences[idx]].color].css);f.innerHTML=FENCE_ICON;d.appendChild(f);}
    else if(S.items[idx]){const s=document.createElement('span');s.className='it';s.innerHTML=S.items[idx]==='dice'?DIE_ICON:FENCE_ICON;d.appendChild(s);}
    d.classList.toggle('pick',S.phase==='fence'&&canFence(idx));});
  // tokens (stacked ones shrink and fan out)
  const groups={};
  tokEls.forEach(t=>{const xy=tokenXY(S.players[t.pi],t.ti);const k=xy.join(',');(groups[k]=groups[k]||[]).push({t,xy});});
  const movable=new Set(S.phase==='move'&&human?S.moves.map(m=>m.ti):[]);
  Object.values(groups).forEach(g=>g.forEach(({t,xy},i)=>{
    let[x,y]=xy;if(g.length>1){const a=i/g.length*Math.PI*2;x+=Math.cos(a)*.24;y+=Math.sin(a)*.18;}
    t.el.style.left=x/15*100+'%';t.el.style.top=(y+.3)/15*100+'%';
    t.el.classList.toggle('small',g.length>1);
    t.el.classList.toggle('can',t.pi===S.turn&&movable.has(t.ti));
    t.el.style.zIndex=Math.round(y*2)+(t.pi===S.turn?1:0);}));
  // number picker
  const old=$('picker');if(old)old.remove();
  if(S.phase==='choose'&&human){const d=document.createElement('div');d.id='picker';
    let nums='';for(let v=1;v<=6;v++)nums+=`<button onclick="chooseValue(${v})" ${validMoves(S.turn,v).length?'':'disabled'} aria-label="${v}">${pips(v)}</button>`;
    d.innerHTML=`<p>Pick your number</p><div class="nums">${nums}</div><button class="x" onclick="cancelMode()">Cancel</button>`;
    $('wrap').appendChild(d);}
  // message
  let m='';const sub=S.msg?`<small>${esc(S.msg)}</small>`:'';
  if(S.phase==='over')m='Game over';
  else if(!human)m=p.type==='human'?`Waiting for ${esc(p.name)}…`:`${esc(p.name)} is playing…`;
  else if(S.phase==='roll')m=`${esc(p.name)}, tap your die`;
  else if(S.phase==='move')m=`Move ${S.roll}: tap a hopping token`;
  else if(S.phase==='fence')m=`Tap a flashing square for your fence <button class="cancel" onclick="cancelMode()">Cancel</button>`;
  else if(S.phase==='choose')m='&nbsp;';
  $('msg').innerHTML=(m||'&nbsp;')+sub;
  if(ONLINE&&!applyingRemote)pushState();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

    <p>Land exactly on a dice card to collect it, then use it to pick any number from 1 to 6. Land exactly on a fence to collect it, then place it to stop opponents.</p>

function showWin(){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="card"><h1>${esc(S.players[S.winners[0]].name)} wins!</h1>
   ${S.winners.map((pi,k)=>`<div class="rank"><b>${k+1}.</b><i style="background:${COLORS[S.players[pi].color].css}"></i>${esc(S.players[pi].name)}</div>`).join('')}
   ${ONLINE&&!ONLINE.isHost?'<p>Waiting for the host to start a rematch.</p><button class="start" id="lv">Leave room</button>':
     `<button class="start" id="again">${ONLINE?'Rematch':'Play again'}</button>`}</div>`;
  ov.id='winov';winShownFor=S.gameId;
  const a=ov.querySelector('#again'),l=ov.querySelector('#lv');
  if(a)a.onclick=()=>{ov.remove();if(ONLINE)newGame();else showSetup();};
  if(l)l.onclick=()=>{ov.remove();leaveRoom();showSetup();};
  document.body.appendChild(ov);
}

/* ---------- online rooms (Firebase Realtime Database) ----------
   Room layout:  rooms/CODE/meta   {n, items, host}
                 rooms/CODE/seats  {colour: {type:'host'|'friend'|'cpu', name, uid}}
                 rooms/CODE/state  {json, writer}   <- whole game state as a JSON string
   Whoever makes a move runs the rules on their phone and writes the new state; everyone else just draws it. */
let ONLINE=null,applyingRemote=false,winShownFor=null,db=null,myName='';
const myId=Math.random().toString(36).slice(2,10);
function fbReady(){
  if(typeof firebase==='undefined')return 'Could not load Firebase. Check your internet connection.';
  if(!FIREBASE_CONFIG.databaseURL||FIREBASE_CONFIG.databaseURL.includes('PASTE'))return 'Online play needs your Firebase settings. Paste them into FIREBASE_CONFIG at the top of the file.';
  if(!db){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();}
  return null;
}
function pushState(){
  if(!ONLINE||!S)return;
  ONLINE.ref.child('state').set({json:JSON.stringify(S),writer:myId});
}
function leaveRoom(){
  if(!ONLINE)return;
  ONLINE.ref.child('state').off();ONLINE.ref.child('seats').off();
  ONLINE=null;
}
function onRemoteState(snap){
  const v=snap.val();if(!v||v.writer===myId)return;
  const next=JSON.parse(v.json),fresh=!S||S.gameId!==next.gameId;
  document.querySelectorAll('#online,#winov').forEach(o=>{if(fresh||o.id==='online')o.remove();});
  applyingRemote=true;S=next;if(fresh)buildBoard();render();applyingRemote=false;
  if(S.phase==='over'&&winShownFor!==S.gameId)showWin();
}
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode=()=>[...Array(4)].map(()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');

function showOnline(){
  const ov=document.createElement('div');ov.className='ov';ov.id='online';
  const err=fbReady();
  const host={n:2,items:true,seats:{0:'host',1:'friend',2:'friend',3:'friend'}};
  const card=html=>{ov.innerHTML=`<div class="card">${html}</div>`;};
  const back=()=>{ov.remove();leaveRoom();showSetup();};

  function home(){
    card(`<h1>Play online</h1>
      <p>One person creates a room and shares the code. Everyone else joins with that code.</p>
      ${err?`<p style="color:#d33;margin-top:10px">${esc(err)}</p>`:''}
      <h2>Your name</h2><div class="seat"><input id="nm" maxlength="12" placeholder="Name" value="${esc(myName)}"></div>
      <button class="start" id="mk" ${err?'disabled':''}>Create a room</button>
      <h2>Join a friend</h2><div class="seat"><input id="cd" maxlength="4" placeholder="Room code" style="text-transform:uppercase;letter-spacing:3px">
      <button id="jn" ${err?'disabled':''}>Join</button></div>
      <p id="jerr" style="color:#d33"></p>
      <button class="x" id="bk" style="margin-top:10px;color:var(--cardMuted);font-weight:700">Back</button>`);
    ov.querySelector('#nm').oninput=e=>myName=e.target.value.trim();
    ov.querySelector('#bk').onclick=back;
    ov.querySelector('#mk').onclick=()=>{if(!myName)return ov.querySelector('#nm').focus();hostSetup();};
    ov.querySelector('#jn').onclick=()=>{if(!myName)return ov.querySelector('#nm').focus();join(ov.querySelector('#cd').value.trim().toUpperCase());};
  }

  function hostSetup(){
    const cols=seatColors(host.n);
    const label={host:'👤 You',friend:'🌐 Friend',cpu:'🤖 Computer'};
    card(`<h1>New room</h1>
      <h2>Players</h2><div class="seg">${[2,3,4].map(n=>`<button class="${host.n===n?'sel':''}" data-n="${n}">${n}</button>`).join('')}</div>
      <h2>Seats</h2><p style="margin-bottom:8px">Tap a seat to switch between you, a friend and the computer.</p>
      ${cols.map(c=>`<div class="seat"><i style="background:${COLORS[c].css}"></i><span style="flex:1">${COLORS[c].name}</span>
        <button data-s="${c}">${label[host.seats[c]]}</button></div>`).join('')}
      <h2>Items</h2><label class="tog"><input type="checkbox" id="itm" ${host.items?'checked':''}> Dice cards and fences on the board</label>
      <button class="start" id="create">Create room</button>
      <button class="x" id="bk" style="margin-top:10px;color:var(--cardMuted);font-weight:700">Back</button>`);
    ov.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{host.n=+b.dataset.n;hostSetup();});
    ov.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const c=b.dataset.s,order=['host','friend','cpu'];
      let t=order[(order.indexOf(host.seats[c])+1)%3];
      if(t==='host')Object.keys(host.seats).forEach(k=>{if(host.seats[k]==='host')host.seats[k]='friend';});
      host.seats[c]=t;
      if(!seatColors(host.n).some(k=>host.seats[k]==='host'))host.seats[c]='host';
      hostSetup();});
    ov.querySelector('#itm').onchange=e=>host.items=e.target.checked;
    ov.querySelector('#bk').onclick=home;
    ov.querySelector('#create').onclick=createRoom;
  }

  async function createRoom(){
    let code,ref;
    for(let i=0;i<8;i++){code=newCode();ref=db.ref('rooms/'+code);if(!(await ref.child('meta').get()).exists())break;}
    const seats={};
    seatColors(host.n).forEach(c=>{const t=host.seats[c];
      seats[c]={type:t,name:t==='host'?myName:t==='cpu'?COLORS[c].name:'',uid:t==='host'?myId:''};});
    await ref.set({meta:{n:host.n,items:host.items,host:myId,created:Date.now()},seats});
    ONLINE={code,ref,myId,isHost:true};
    ref.child('state').on('value',onRemoteState);
    ref.child('seats').on('value',snap=>lobby(snap.val()||{}));
  }

  async function join(code){
    const jerr=ov.querySelector('#jerr');
    if(code.length!==4){jerr.textContent='Room codes have 4 characters.';return;}
    const ref=db.ref('rooms/'+code);
    const meta=(await ref.child('meta').get()).val();
    if(!meta){jerr.textContent='No room with code '+code+'. Check the code with your friend.';return;}
    let mySeat=null;
    const res=await ref.child('seats').transaction(seats=>{
      if(!seats)return seats;mySeat=null;
      for(const c of Object.keys(seats)){if(seats[c].uid===myId){mySeat=c;return seats;}}
      for(const c of Object.keys(seats)){if(seats[c].type==='friend'&&!seats[c].uid){seats[c].uid=myId;seats[c].name=myName;mySeat=c;return seats;}}
      return;});
    if(!res.committed||mySeat===null){jerr.textContent='This room is full or the game has already started.';return;}
    ONLINE={code,ref,myId,isHost:false};
    ref.child('state').on('value',onRemoteState);
    ref.child('seats').on('value',snap=>lobby(snap.val()||{}));
  }

  function lobby(seats){
    if(!ONLINE||!document.getElementById('online'))return;
    const cols=Object.keys(seats).map(Number).sort();
    const ready=cols.every(c=>seats[c].type==='cpu'||seats[c].uid);
    const share=`Join my Ludo Talent game with code ${ONLINE.code}: ${location.href.split('#')[0]}`;
    card(`<h1>Room ${ONLINE.code}</h1>
      <p>${ONLINE.isHost?'Send this code to your friends. Start when everyone has joined.':'You are in. Waiting for the host to start the game.'}</p>
      ${ONLINE.isHost?`<button class="start" id="sh" style="background:var(--blue);box-shadow:0 4px 0 var(--blueD)">Share code</button>`:''}
      <h2>Players</h2>
      ${cols.map(c=>{const s=seats[c];const who=s.type==='cpu'?'🤖 Computer':s.uid?esc(s.name)+(s.uid===myId?' (you)':''):'Waiting to join…';
        return `<div class="seat"><i style="background:${COLORS[c].css}"></i><span style="flex:1">${who}</span></div>`;}).join('')}
      ${ONLINE.isHost?`<button class="start" id="st" ${ready?'':'disabled style="opacity:.5"'}>Start game</button>`:''}
      <button class="x" id="bk" style="margin-top:10px;color:var(--cardMuted);font-weight:700">Leave room</button>`);
    ov.querySelector('#bk').onclick=back;
    const sh=ov.querySelector('#sh');
    if(sh)sh.onclick=async()=>{try{if(navigator.share)await navigator.share({text:share});else{await navigator.clipboard.writeText(share);sh.textContent='Copied';}}catch(e){}};
    const st=ov.querySelector('#st');
    if(st&&ready)st.onclick=async()=>{
      const meta=(await ONLINE.ref.child('meta').get()).val();
      cfg.n=meta.n;cfg.items=meta.items;
      cfg.seats=[0,1,2,3].map(c=>seats[c]?{name:seats[c].name||COLORS[c].name,type:seats[c].type==='cpu'?'cpu':'human',uid:seats[c].uid||null}:{name:'',type:'human',uid:null});
      ov.remove();newGame();};
  }
  home();document.body.appendChild(ov);
}

$('menu').onclick=()=>{if(document.getElementById('setup')||document.getElementById('online'))return;
  document.querySelectorAll('.ov').forEach(o=>o.remove());leaveRoom();showSetup();};
showSetup();
</script>
