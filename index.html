<style>
:root{
  --card:#ffffff; --cardInk:#203040; --cardMuted:#61707f; --chip:#eef3f8;
  --grass:#cfeb68; --grass2:#bddf52; --grassLine:rgba(70,125,15,.45); --island:#a4d23f; --dirt:#8a5527;
  --red:#e8433a; --green:#1f8f55; --yellow:#f5cf1d; --blue:#3a7fe6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --card:#1b2a3d; --cardInk:#e9f0f8; --cardMuted:#9cb0c6; --chip:#26384e; color-scheme: dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:#fff;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;}
body{min-height:100svh;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:max(6px,env(safe-area-inset-top)) 4px 10px;overflow-x:hidden;
  background:
   radial-gradient(1.6px 1.6px at 12% 22%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 78% 9%,#fffc 50%,transparent),
   radial-gradient(1.4px 1.4px at 63% 31%,#fffb 50%,transparent),radial-gradient(1px 1px at 30% 64%,#fffa 50%,transparent),
   radial-gradient(1.6px 1.6px at 88% 72%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 8% 90%,#fffb 50%,transparent),
   radial-gradient(1px 1px at 47% 96%,#fffa 50%,transparent),radial-gradient(1.3px 1.3px at 95% 40%,#fffc 50%,transparent),
   radial-gradient(60% 20% at 85% 95%,#b9a6ff33,transparent),radial-gradient(50% 18% at 10% 98%,#a6c0ff33,transparent),
   linear-gradient(180deg,#1b2a7a 0%,#2c3d9e 35%,#4a4fb8 75%,#6a5cc4 100%) fixed;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:10px}
:root{--B:min(calc(100vw - 4px),calc(100svh - 250px),620px);--u:calc(var(--B)/15)}

/* top bar */
#top{width:min(100%,600px);display:flex;justify-content:space-between;align-items:center;padding:0 6px}
#top button{width:38px;height:38px;display:grid;place-items:center}
#top svg{width:28px;height:28px;filter:drop-shadow(0 2px 2px #0006)}

/* player corners */
.row{width:var(--B);display:flex;justify-content:space-between;align-items:flex-start;min-height:96px;padding:0 4px}
#botRow{align-items:flex-end}
.corner{display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:opacity .25s}
.corner.t{flex-direction:column-reverse}
.corner.r{align-items:flex-end}
.corner.empty{visibility:hidden}
.corner.out{opacity:.45}
.prow{display:flex;align-items:center;gap:12px}
.corner.r .prow{flex-direction:row-reverse}
.brow{display:flex;gap:7px;background:#0c1550aa;padding:4px 8px;border-radius:999px}
.brow.hidden{visibility:hidden}
.ava{width:46px;height:46px;border-radius:50%;border:3.5px solid #5fe3a1;background:radial-gradient(circle at 50% 35%,#e6b9a3,#b9846c);
  display:grid;place-items:center;position:relative;box-shadow:0 0 0 2px #0d3d2a55,0 3px 8px #0005}
.ava i{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.ava svg{width:78%;height:78%;margin-top:22%}
.ava .bot{position:absolute;right:-2px;bottom:-2px;font-size:16px}
.corner.on .ava{border-color:#ffe066;box-shadow:0 0 0 3px #ffe06655,0 0 18px #ffe066aa}

/* the big dice */
.bigdie{width:42px;height:42px;border-radius:10px;position:relative;display:block;padding:5px;
  background:linear-gradient(160deg,#ffffff 0%,#f3f6fb 55%,#dfe6f0 100%);
  box-shadow:inset 0 -3px 0 #c8d2e2,inset 0 2px 0 #fff,0 4px 0 #9fb0cc,0 7px 10px #0005}
.bigdie.hide{visibility:hidden}
.bigdie .pips{display:block;width:100%;height:100%;fill:#1f2d78}
.bigdie .go{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:19px;color:#2a3a8c;letter-spacing:-.5px}
.bigdie.go{animation:bob 1s ease-in-out infinite;box-shadow:inset 0 -3px 0 #c8d2e2,0 5px 0 #9fb0cc,0 0 0 3px #ffe066,0 0 20px 4px #ffe066aa}
.bigdie.spin{animation:tumble .2s linear infinite}
.bigdie.chosen .pips{fill:#e0700f}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}50%{transform:rotate(180deg) translateY(-8px) scale(.92)}100%{transform:rotate(360deg) translateY(0)}}

/* item bubbles */
.bub{width:40px;height:40px;border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 26%,#ffffffee 0 8%,#ffffff55 14%,#9fd2ff30 45%,#4d7fd855 80%,#cfe6ff99 100%);
  box-shadow:inset 0 0 0 1.5px #ffffffaa,inset 0 -4px 8px #6ea8ff66,0 3px 6px #0004}
.bub svg{width:66%;height:66%}
.bub b{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:#ff3b3b;color:#fff;
  font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.bub:disabled{cursor:default}
.bub.zero{opacity:.55}
.bub.live{box-shadow:inset 0 0 0 1.5px #fff,0 0 0 3px #ffe066,0 0 16px #ffe066}

/* board */
#wrap{position:relative;width:var(--B);height:var(--B)}
#board{position:absolute;inset:0;display:grid;grid-template:repeat(15,1fr)/repeat(15,1fr)}
.isl{border-radius:calc(var(--u)*.3);background:var(--island);
  box-shadow:inset 0 0 0 calc(var(--u)*.08) #b9e35a,0 calc(var(--u)*.26) 0 var(--dirt),0 calc(var(--u)*.32) 10px #0005}
.yard{margin:calc(var(--u)*.2);display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 30% 25%,#cdeb6a,#a9d544 70%)}
.nest{width:71%;height:71%;border-radius:16%;background:var(--yd);padding:4%;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:3%;
  box-shadow:0 0 0 calc(var(--u)*.1) #ffffff40,0 4px 0 #0002}
.nest.on{box-shadow:0 0 0 calc(var(--u)*.12) #fff6b0,0 0 calc(var(--u)*.6) #fff27a}
.nest b{border-radius:16%;background:var(--y1);display:grid;place-items:center}
.nest b:nth-child(2),.nest b:nth-child(3){background:var(--y2)}
.nest b::after{content:"";width:58%;height:58%;border-radius:50%;background:var(--yh);box-shadow:inset 0 4px 5px #0005}
.lbl{position:absolute;left:0;right:0;bottom:2%;text-align:center;font-weight:800;font-size:calc(var(--u)*.42);color:#4f8a1d;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10%}
.lbl.flip{bottom:auto;top:2%;transform:rotate(180deg)}
.cell{position:relative;display:grid;place-items:center;background:var(--grass);box-shadow:inset -1px -1px 0 var(--grassLine),inset 1px 1px 0 #ffffff55}
.cell.alt{background:var(--grass2)}
.cell.path{background:var(--pc);box-shadow:none}
.cell.path::after{content:"";position:absolute;inset:12%;border-radius:50%;background:#ffffff40;box-shadow:inset 0 0 0 2px #ffffff60}
.star{width:62%;height:62%;color:#3c8a22;opacity:.75}
.cell.path .star{position:relative;z-index:1;color:#2e7a1a;opacity:.85}
.center{position:relative}
.center svg{position:absolute;inset:0;width:100%;height:100%}
.bridge{position:absolute;transform:translate(-50%,-50%);pointer-events:none;width:calc(var(--u)*.95);height:calc(var(--u)*.56);border-radius:5px;
  background:linear-gradient(#c9773a,#a85c26);box-shadow:inset 0 2px 0 #e9a067,0 3px 0 #6e3a14}
.bridge::before,.bridge::after{content:"";position:absolute;top:18%;bottom:18%;width:2px;background:#7a4119}
.bridge::before{left:33%}.bridge::after{left:66%}
.bridge.v{transform:translate(-50%,-50%) rotate(90deg)}

/* things on squares */
.it{position:absolute;inset:6%;z-index:2;display:grid;place-items:center;animation:float 1.8s ease-in-out infinite}
.it svg{width:100%;height:100%;filter:drop-shadow(0 2px 1px #0005)}
.it.plus{animation:blinkpop 1s ease-in-out infinite}
.it.new{animation:pop .45s ease-out,float 1.8s ease-in-out .45s infinite}
.it.plus.new{animation:pop .45s ease-out,blinkpop 1s ease-in-out .45s infinite}
@keyframes float{50%{transform:translateY(-10%)}}
@keyframes blinkpop{50%{transform:scale(1.13);filter:brightness(1.25)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.fn{position:absolute;inset:-8% -4%;z-index:3;display:grid;place-items:center}
.fn svg{width:100%;height:100%;filter:drop-shadow(0 0 3px var(--fcol)) drop-shadow(0 0 2px var(--fcol)) drop-shadow(0 2px 1px #0006)}
.cell.pick{cursor:pointer}
.cell.pick::before{content:"";position:absolute;inset:5%;border-radius:5px;border:2.5px dashed #fff;animation:blink .9s infinite;z-index:4}
@keyframes blink{50%{opacity:.25}}

/* tokens */
#tokens{position:absolute;inset:0;pointer-events:none}
.tk{position:absolute;width:calc(var(--u)*1.06);height:calc(var(--u)*1.41);transform:translate(-50%,-78%);
  transition:left .15s ease-in-out,top .15s ease-in-out;pointer-events:auto}
.tk svg{width:100%;height:100%;overflow:visible}
.tk.small{width:calc(var(--u)*.7);height:calc(var(--u)*.93)}
.tk.can{animation:hop .5s ease-in-out infinite}
.tk.can::before{content:"";position:absolute;left:50%;bottom:9%;width:100%;height:26%;transform:translateX(-50%);
  border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 8px #fff,inset 0 0 6px #fff}
@keyframes hop{50%{transform:translate(-50%,-96%)}}
#arrow{position:absolute;width:calc(var(--u)*1.1);height:calc(var(--u)*1.3);transform:translate(-50%,-50%);z-index:60;pointer-events:none;
  animation:arrowbob .7s ease-in-out infinite}
#arrow.up{animation-name:arrowbobup}
@keyframes arrowbob{50%{margin-top:calc(var(--u)*.3)}}
@keyframes arrowbobup{50%{margin-top:calc(var(--u)*-.3)}}

/* fence confirm */
.cell.chosenF::before{content:"";position:absolute;inset:0;background:#fff6;border-radius:4px;z-index:3;animation:none}
.ghost{position:absolute;inset:-6%;z-index:4;opacity:.75;animation:blink 1s infinite}
.ghost svg{width:100%;height:100%}
#fconfirm{position:absolute;z-index:90;transform:translate(-50%,-112%);display:flex;gap:5px;background:#0d1a4fdd;padding:4px;border-radius:999px;
  box-shadow:0 4px 12px #0007}
#fconfirm.below{transform:translate(-50%,15%)}
#fconfirm button{width:30px;height:30px;border-radius:50%;font-size:17px;font-weight:900;color:#fff;display:grid;place-items:center}
#fconfirm .ok{background:#22b14c;box-shadow:0 3px 0 #157a33}
#fconfirm .no{background:#e8433a;box-shadow:0 3px 0 #a3201a}
/* throwables */
.corner{position:relative}
.bub.emo span{font-size:22px;line-height:1}
.tray{position:absolute;z-index:95;display:flex;gap:4px;background:#ffffffee;padding:6px 8px;border-radius:999px;box-shadow:0 6px 16px #0007}
.corner:not(.t) .tray{bottom:calc(100% + 6px)}
.corner.t .tray{top:calc(100% + 6px)}
.corner.r .tray{right:0}
.tray button{font-size:24px;width:38px;height:38px;border-radius:50%}
.tray button:active{transform:scale(1.2)}
.ava{cursor:pointer}
.ava.target{animation:tgt .8s ease-in-out infinite;border-color:#ff5a5a}
@keyframes tgt{50%{box-shadow:0 0 0 6px #ff5a5a66,0 0 18px #ff5a5a}}
.ava.hit{animation:shake .5s ease-in-out}
@keyframes shake{20%{transform:translateX(-7px) rotate(-8deg)}40%{transform:translateX(6px) rotate(6deg)}60%{transform:translateX(-4px) rotate(-3deg)}80%{transform:translateX(3px)}}
.ava.loved{box-shadow:0 0 0 4px #ff6fa8,0 0 24px #ff6fa8}
.splat{position:fixed;z-index:205;border-radius:50%;background:radial-gradient(circle at 45% 50%,#e82a1fcc 0 35%,#e82a1f88 50%,transparent 68%);
  animation:splat 1.6s ease-out forwards;pointer-events:none}
@keyframes splat{0%{transform:scale(.2)}15%{transform:scale(1.15)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(6px)}}
.proj{position:fixed;z-index:210;font-size:38px;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 3px #0006)}
.burst{position:fixed;z-index:210;font-size:24px;pointer-events:none;transform:translate(-50%,-50%);animation:burst 1.2s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);opacity:0}}
/* chat */
#chatBtn b{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:9px;background:#ff3b3b;color:#fff;font-size:11px;font-weight:900;
  display:grid;place-items:center;padding:0 3px;box-shadow:0 0 0 2px #1b2a7a}
#chat{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100vw,520px);height:min(62svh,460px);z-index:150;
  background:var(--card);color:var(--cardInk);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0007;display:flex;flex-direction:column;
  padding:12px 12px max(12px,env(safe-area-inset-bottom))}
#chat[hidden]{display:none}
.chead{display:flex;justify-content:space-between;align-items:center;font-size:17px;padding:0 4px 8px}
.chead button{font-size:20px;color:var(--cardMuted);width:34px;height:34px}
#clog{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
.cm{align-self:flex-start;max-width:82%;background:var(--chip);border-radius:14px 14px 14px 4px;padding:7px 11px;font-size:15px;line-height:1.35;word-wrap:break-word}
.cm span{display:block;font-size:12px;font-weight:800;margin-bottom:1px}
.cm.mine{align-self:flex-end;background:#d9f7e3;color:#163d22;border-radius:14px 14px 4px 14px}
@media (prefers-color-scheme: dark){.cm.mine{background:#1f5a35;color:#e6fff0}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.quick button{flex:none;background:var(--chip);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}
.cin{display:flex;gap:8px}
.cin input{flex:1;min-width:0;border:none;background:var(--chip);border-radius:999px;padding:11px 14px;font:inherit;font-size:16px;color:inherit}
.cin button{background:#22b14c;color:#fff;font-weight:800;border-radius:999px;padding:0 18px}
.speech{position:fixed;z-index:160;width:max-content;max-width:200px;background:#fff;color:#203040;font-weight:700;font-size:14px;padding:8px 12px;border-radius:14px;
  box-shadow:0 4px 12px #0006;pointer-events:none;animation:speech 3.5s ease forwards}
@keyframes speech{0%{opacity:0;scale:.6}8%{opacity:1;scale:1}85%{opacity:1}100%{opacity:0}}
/* pickup flight */
.fly{position:fixed;z-index:200;pointer-events:none;will-change:transform}
.fly svg{width:100%;height:100%;filter:drop-shadow(0 0 8px #fff8a0) drop-shadow(0 3px 2px #0006)}
.plusPop{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-50%);font-weight:900;font-size:44px;color:#fff;
  -webkit-text-stroke:3px #c24f00;paint-order:stroke;text-shadow:0 0 18px #ffd34d;animation:plusPop 1.1s ease-out forwards}
@keyframes plusPop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.25);opacity:1}
  70%{transform:translate(-50%,-80%) scale(1);opacity:1}100%{transform:translate(-50%,-130%) scale(.9);opacity:0}}
.bump{animation:bump .45s ease-out}
@keyframes bump{40%{transform:scale(1.3)}}
/* message */
#msg{width:var(--B);min-height:30px;text-align:center;font-size:14px;font-weight:700;text-shadow:0 1px 3px #0008;
  display:flex;flex-direction:column;align-items:center;gap:4px}
#msg small{font-weight:600;color:#d8e3ff;font-size:13px}
#msg .cancel{background:#fff;color:#203040;border-radius:999px;padding:6px 16px;font-size:14px;text-shadow:none}

/* number picker */
#picker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#ffffffee;color:#203040;border-radius:20px;
  padding:14px;box-shadow:0 10px 30px #0007;z-index:80;text-align:center;width:min(84%,300px)}
#picker p{margin:0 0 10px;font-weight:900}
#picker .nums .bigdie{width:52px;height:52px;padding:6px}
#picker .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}
#picker .nums .bigdie:disabled{opacity:.3}
#picker .x{margin-top:12px;color:#61707f;font-weight:800}

@media (prefers-reduced-motion:reduce){.it,.it.plus,.bigdie.go,.bigdie.spin,.tk.can,#arrow,.cell.pick::before{animation:none}.tk{transition:none}}

/* overlays */
.ov{position:fixed;inset:0;background:#0a1240aa;display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.card{background:var(--card);color:var(--cardInk);border-radius:20px;padding:20px;width:min(92vw,400px);max-height:92svh;overflow:auto}
.card h1{margin:0 0 6px;font-size:28px;letter-spacing:-.5px}
.card h2{font-size:15px;margin:16px 0 8px}
.card p{margin:0;color:var(--cardMuted);font-size:14px;line-height:1.45}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--chip);background:var(--chip);border-radius:10px;padding:9px 0;font-weight:800}
.seg button.sel{border-color:var(--cardInk)}
.seat{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.seat i{width:18px;height:18px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
.seat input{flex:1;min-width:0;border:none;background:var(--chip);border-radius:9px;padding:9px;font:inherit;color:inherit}
.seat button{border-radius:9px;padding:9px 10px;background:var(--chip);min-width:104px;font-size:14px}
.tog{display:flex;align-items:center;gap:10px;font-size:14px}
.tog input{width:20px;height:20px}
.start{width:100%;margin-top:18px;padding:14px;font-size:17px;font-weight:800;border-radius:14px;background:#22b14c;color:#fff;box-shadow:0 4px 0 #157a33}
.start:disabled{opacity:.5;cursor:default}
.card .x{display:block;margin:12px auto 0;color:var(--cardMuted);font-weight:800}
.rank{display:flex;gap:10px;align-items:center;font-size:17px;padding:6px 0}
.rank i{width:16px;height:16px;border-radius:50%}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div id="top">
  <button id="back" aria-label="Leave game"><svg viewBox="0 0 32 32"><path d="M19 6 9 16l10 10M10 16h15" fill="none" stroke="#6fb6ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="chatBtn" aria-label="Chat" onclick="openChat()" style="margin-left:auto;margin-right:4px;display:none;position:relative"><svg viewBox="0 0 32 32"><path fill="#6fb6ff" d="M5 6h22a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H14l-6 5v-5H5a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z"/><circle cx="10" cy="14.5" r="2" fill="#1b2a7a"/><circle cx="16" cy="14.5" r="2" fill="#1b2a7a"/><circle cx="22" cy="14.5" r="2" fill="#1b2a7a"/></svg><b id="chatBadge"></b></button>
  <button id="snd" aria-label="Sound on or off" onclick="toggleSound()" style="margin-right:6px"></button>
  <button id="menu" aria-label="Settings"><svg viewBox="0 0 32 32"><path fill="#6fb6ff" d="M13.6 2h4.8l.8 3.6 2.6 1.1 3.1-2 3.4 3.4-2 3.1 1.1 2.6 3.6.8v4.8l-3.6.8-1.1 2.6 2 3.1-3.4 3.4-3.1-2-2.6 1.1-.8 3.6h-4.8l-.8-3.6-2.6-1.1-3.1 2-3.4-3.4 2-3.1-1.1-2.6L2 18.4v-4.8l3.6-.8 1.1-2.6-2-3.1 3.4-3.4 3.1 2 2.6-1.1zM16 11a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg></button>
</div>
<div class="row" id="topRow"></div>
<div id="wrap"><div id="board"></div><div id="tokens"></div></div>
<div class="row" id="botRow"></div>
<div id="msg" aria-live="polite"></div>
<div id="chat" hidden>
  <div class="chead"><b>Chat</b><button onclick="closeChat()" aria-label="Close chat">✕</button></div>
  <div id="clog"></div>
  <div class="quick"></div>
  <div class="cin"><input id="ctext" maxlength="120" placeholder="Type a message" enterkeyhint="send"><button onclick="sendChat()">Send</button></div>
</div>
<script>
/* ---------- geometry ---------- */
const TRACK=[];const P=(r,c)=>TRACK.push([r,c]);
for(let c=1;c<=5;c++)P(6,c);
for(let r=5;r>=0;r--)P(r,6);
P(0,7);
for(let r=0;r<=5;r++)P(r,8);
for(let c=9;c<=14;c++)P(6,c);
P(7,14);
for(let c=14;c>=9;c--)P(8,c);
for(let r=9;r<=14;r++)P(r,8);
P(14,7);
for(let r=14;r>=9;r--)P(r,6);
for(let c=5;c>=0;c--)P(8,c);
P(7,0);P(6,0);

// colour 0 = top-left (red), 1 = top-right (green), 2 = bottom-right (yellow), 3 = bottom-left (blue)
const COLORS=[
  {key:'red',   name:'Red',   css:'#e8433a', path:'#e8433a', y1:'#ef4a3c', y2:'#e23a2d', yd:'#c42a1f', yh:'#9c1209', pawn:['#ffb0a3','#ef3b2f','#a3120a']},
  {key:'green', name:'Green', css:'#1f8f55', path:'#1f8f55', y1:'#1f9a62', y2:'#16865a', yd:'#0f6e47', yh:'#0b4f33', pawn:['#e4ffa6','#86d92e','#3f8a0c']},
  {key:'yellow',name:'Yellow',css:'#f5b318', path:'#f5cf1d', y1:'#ffa726', y2:'#fb9a1a', yd:'#e2780b', yh:'#c9520a', pawn:['#fff0a8','#ffbe1f','#c97400']},
  {key:'blue',  name:'Blue',  css:'#3a7fe6', path:'#3a7fe6', y1:'#4a8cf2', y2:'#3b7de8', yd:'#2a5fca', yh:'#1c49a8', pawn:['#c8f4ff','#2fb4f2','#0a5fb0']}];
const HOME=[
  [1,2,3,4,5].map(c=>[7,c]),
  [1,2,3,4,5].map(r=>[r,7]),
  [13,12,11,10,9].map(c=>[7,c]),
  [13,12,11,10,9].map(r=>[r,7])];
const SAFE=new Set([0,8,13,21,26,34,39,47]);
const YARD=[[0,0],[9,0],[9,9],[0,9]];           // x,y of yard corner
const SPOTS=[[2,2],[4,2],[2,4],[4,4]];
const FINISH=[[6.85,7.5],[7.5,6.85],[8.15,7.5],[7.5,8.15]];
const ITEM_TYPES=['dice','fence','plus'];
// after any pickup, that item type is re-scattered: 3 (40%), 4 (40%) or 5 (20%) of them at fresh random squares
// Items: each type starts with 3 or 4 on the board. Items that are not collected never move.
// After a pickup, 0-4 NEW ones of that type appear (0:1/7, 1:2/7, 2:2/7, 3:1/7, 4:1/7), never more than 6 of a type
// on the board at once, and never fewer than 2.
const START_COUNTS=[3,4],ADD_COUNTS=[0,1,1,2,2,3,4],MAX_ON_BOARD=6,MIN_ON_BOARD=2,STEP=170;   // ms per square a token moves
// Six weighting: base weights 1,1,1,1,1,1.2 -> P(6) = 1.2/6.2 = 19.4% (a fair die is 16.7%).
// The bonus roll right after a 6 uses a plain fair die, so double sixes stay rare (about 3.7% of rolls).
// Drought protection: after 5 rolls in a row without a 6, each further dry roll adds +1.5 to the six's weight
// (dry 6 -> 2.7/7.7 = 35%, dry 8 -> 5.7/10.7 = 53%). Overall about 22% sixes; longest wait in 200,000 test rolls: 16.
const ROLL_WEIGHTS=[1,1,1,1,1,1.2];
let SPEED=1;
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
const $=id=>document.getElementById(id);
function rollDie(dry=0,afterSix=false){
  const w=ROLL_WEIGHTS.slice();
  if(afterSix)w[5]=1;else w[5]+=Math.max(0,dry-5)*1.5;
  const tot=w.reduce((a,b)=>a+b,0);let x=Math.random()*tot;
  for(let i=0;i<6;i++){x-=w[i];if(x<0)return i+1;}return 6;
}

/* ---------- state ---------- */
let S=null, cfg={n:2,seats:[
  {name:'',type:'human'},{name:'',type:'human'},{name:'',type:'human'},{name:'',type:'human'}],items:true};

// turn order is clockwise starting from blue (bottom-left)
function seatColors(n){return n===2?[3,1]:n===3?[3,0,1]:[3,0,1,2];}
function newGame(){
  const cols=seatColors(cfg.n);
  S={players:cols.map((c,i)=>({color:c,name:(cfg.seats[c].name||'').trim()||COLORS[c].name,
      type:cfg.seats[c].type,uid:cfg.seats[c].uid||null,tokens:[-1,-1,-1,-1],dice:0,fence:0,done:false})),
     gameId:Math.random().toString(36).slice(2),
     turn:0,phase:'roll',roll:null,chosen:false,sixes:0,fenceUsed:false,
     items:{},fences:{},fresh:[],moves:[],winners:[],msg:'',itemsOn:cfg.items};
  ITEM_TYPES.forEach(t=>addItems(t,START_COUNTS[Math.floor(Math.random()*START_COUNTS.length)]));buildBoard();turnStart();
}
const cur=()=>S.players[S.turn];
const cellOf=(p,prog)=>(p.color*13+prog)%52;

function tokenXY(p,ti){
  const g=p.tokens[ti];
  if(g<0){const[bx,by]=YARD[p.color],[sx,sy]=SPOTS[ti];return[bx+sx,by+sy];}
  if(g<=50){const[r,c]=TRACK[cellOf(p,g)];return[c+.5,r+.5];}
  if(g<=55){const[r,c]=HOME[p.color][g-51];return[c+.5,r+.5];}
  return FINISH[p.color];
}
function occupied(idx){
  return S.players.some(p=>p.tokens.some(g=>g>=0&&g<=50&&cellOf(p,g)===idx));
}
const countOf=type=>Object.values(S.items).filter(t=>t===type).length;
// a pickup leaves the other items of that type exactly where they are and adds 0-4 new ones elsewhere
function refreshItems(type){
  if(!S.itemsOn)return;
  let add=ADD_COUNTS[Math.floor(Math.random()*ADD_COUNTS.length)];
  const now=countOf(type);
  add=Math.min(add,MAX_ON_BOARD-now);
  if(now+add<MIN_ON_BOARD)add=MIN_ON_BOARD-now;
  addItems(type,add);
}
function addItems(type,n){
  if(!S.itemsOn||n<=0)return;
  let placed=0,tries=0;
  while(placed<n&&tries++<300){
    const idx=Math.floor(Math.random()*52);
    if(SAFE.has(idx)||S.items[idx]||S.fences[idx]!==undefined||occupied(idx))continue;
    S.items[idx]=type;placed++;S.fresh.push(idx);
  }
}

/* ---------- rules ---------- */
// A fence stops EVERY token (its owner's too) on the square just before it. It is never broken by being
// reached; it simply disappears when its owner's next turn starts.
function simulate(pi,ti,v){
  const p=S.players[pi],g=p.tokens[ti];
  if(g===56)return null;
  if(g===-1)return v===6?{path:[0],blocked:false}:null;
  if(g+v>56)return null;
  const path=[];let blocked=false;
  for(let s=g+1;s<=g+v;s++){
    if(s<=50){const f=S.fences[cellOf(p,s)];
      if(f!==undefined){blocked=true;break;}}
    path.push(s);
  }
  if(!path.length)return null;        // fence right in front: this token cannot move
  return {path,blocked};
}
function validMoves(pi,v){
  const out=[];
  S.players[pi].tokens.forEach((_,ti)=>{const sim=simulate(pi,ti,v);if(sim)out.push({ti,sim});});
  return out;
}
const finalOf=(pi,m)=>m.sim.path[m.sim.path.length-1];
function capturesAt(pi,idx){
  if(SAFE.has(idx))return 0;let n=0;
  S.players.forEach((q,qi)=>{if(qi!==pi)q.tokens.forEach(g=>{if(g>=0&&g<=50&&cellOf(q,g)===idx)n++;});});
  return n;
}
function removeFencesOf(pi){for(const k in S.fences)if(S.fences[k]===pi)delete S.fences[k];}

function turnStart(){
  S.phase='roll';S.roll=null;S.chosen=false;S.fenceUsed=false;S.moves=[];
  render();
  if(cur().type==='cpu')botTurn();
}
function nextTurn(bonus){
  if(S.phase==='over')return;
  if(!bonus||cur().done){
    S.sixes=0;
    do{S.turn=(S.turn+1)%S.players.length;}while(cur().done);
    removeFencesOf(S.turn);           // your fences expire when your turn comes round again
  }
  turnStart();
}

async function doRoll(){
  if(S.phase!=='roll')return;
  S.phase='anim';S.rolling=true;rollStartedAt=Date.now();
  for(let k=0;k<5;k++){S.roll=1+Math.floor(Math.random()*6);render();await sleep(45);}
  S.rolling=false;const v=rollDie(cur().dry||0,S.sixes>0);
  S.roll=v;S.chosen=false;cur().last=v;cur().dry=v===6?0:(cur().dry||0)+1;
  if(v===6){S.sixes++;
    if(S.sixes===3){S.msg='Three sixes in a row, turn lost.';render();await sleep(1100);S.msg='';nextTurn(false);return;}
  }else S.sixes=0;
  afterValue();
}
function chooseValue(v){
  if(S.phase!=='choose')return;
  cur().dice--;S.roll=v;S.chosen=true;cur().last=v;S.phase='anim';afterValue();
}
async function afterValue(){
  const pi=S.turn,moves=validMoves(pi,S.roll);
  if(!moves.length){S.msg='No move possible.';render();await sleep(300);S.msg='';nextTurn(false);return;}
  S.moves=moves;S.phase='move';render();
  if(cur().type==='cpu'){await sleep(250);const m=botPick(pi,moves);doMove(pi,m.ti,m.sim);return;}
  const distinct=new Set(moves.map(m=>cur().tokens[m.ti]));
  if(distinct.size===1){await sleep(180);if(S.phase==='move'&&S.turn===pi)doMove(pi,moves[0].ti,moves[0].sim);}
}
async function doMove(pi,ti,sim){
  if(S.phase!=='move')return;
  S.phase='anim';S.moves=[];S.msg='';S.fresh=[];
  const p=S.players[pi],notes=[];let bonus=false;
  for(const s of sim.path){
    p.tokens[ti]=s;render();await sleep(STEP);
  }
  if(sim.blocked)notes.push('stopped at a fence');
  // items are only collected when the move ENDS exactly on them
  const end=p.tokens[ti];
  if(end>=0&&end<=50){const idx=cellOf(p,end),it=S.items[idx];
    if(it){delete S.items[idx];
      if(it==='dice'){p.dice++;notes.push('collected a dice');}
      else if(it==='fence'){p.fence++;notes.push('collected a fence');}
      else{bonus=true;notes.push('got +1, extra roll');}
      S.fx={id:Math.random().toString(36).slice(2),kind:it,idx,pi};
      refreshItems(it);render();await sleep(380);}}
  const g=p.tokens[ti];
  if(g<=50){const idx=cellOf(p,g);
    if(!SAFE.has(idx)){S.players.forEach((q,qi)=>{if(qi===pi)return;
      q.tokens.forEach((t,k)=>{if(t>=0&&t<=50&&cellOf(q,t)===idx){q.tokens[k]=-1;bonus=true;notes.push(`captured ${q.name}`);}});});}}
  if(g===56){bonus=true;notes.push('brought a token home');}
  if(S.roll===6)bonus=true;            // rolled or picked with a dice card, a 6 always gives another turn
  if(!p.done&&p.tokens.every(t=>t===56)){p.done=true;S.winners.push(pi);removeFencesOf(pi);notes.push('finished!');}
  const left=S.players.filter(q=>!q.done);
  if(notes.length)S.msg=`${p.name} ${[...new Set(notes)].join(', ')}.`;
  render();
  if(left.length<=1){if(left.length)S.winners.push(S.players.indexOf(left[0]));S.phase='over';render();await sleep(500);showWin();return;}
  await sleep(notes.length?300:60);
  nextTurn(bonus);
}

/* fence */
function canFence(idx){return !SAFE.has(idx)&&!S.items[idx]&&S.fences[idx]===undefined&&!occupied(idx);}
function placeFence(idx){
  if(S.phase!=='fence'||!canFence(idx))return;
  S.fences[idx]=S.turn;cur().fence--;S.fenceUsed=true;S.phase='roll';
  S.msg=`${cur().name} placed a fence until their next turn.`;render();
}

/* ---------- computer player ---------- */
function botScore(pi,m){
  const p=S.players[pi],g=p.tokens[m.ti],f=finalOf(pi,m);let sc=f-g;
  if(f===56)sc+=100;
  if(g===-1)sc+=55;
  if(g<=50&&f>50)sc+=35;
  if(f<=50){const idx=cellOf(p,f);
    sc+=capturesAt(pi,idx)*90;
    if(S.items[idx])sc+=S.items[idx]==='plus'?30:22;
    if(SAFE.has(idx))sc+=18;
    else{S.players.forEach((q,qi)=>{if(qi===pi)return;q.tokens.forEach(t=>{
      if(t>=0&&t<=50){const d=(idx-cellOf(q,t)+52)%52;if(d>=1&&d<=6)sc-=28;}});});}}
  if(m.sim.blocked)sc-=6;
  return sc+Math.random()*3;
}
function botPick(pi,moves){return moves.reduce((a,b)=>botScore(pi,b)>botScore(pi,a)?b:a);}
async function botTurn(){
  const pi=S.turn;await sleep(300);
  if(S.turn!==pi||S.phase!=='roll')return;
  const p=cur();
  if(p.fence>0&&!S.fenceUsed&&Math.random()<.7){
    let best=null;
    S.players.forEach((q,qi)=>{if(qi===pi)return;q.tokens.forEach(t=>{
      if(t>=0&&t<=46&&(!best||t>best.t))best={q,t};});});
    if(best){for(let k=2;k<=5;k++){const idx=cellOf(best.q,best.t+k);
      if(canFence(idx)){S.phase='fence';placeFence(idx);await sleep(500);break;}}}
  }
  if(p.dice>0){
    let pick=null;
    for(let v=1;v<=6&&!pick;v++)for(const m of validMoves(pi,v)){const f=finalOf(pi,m);
      if((f<=50&&capturesAt(pi,cellOf(p,f)))||(f===56&&p.tokens[m.ti]<56)){pick=v;break;}}
    if(!pick&&p.tokens.every(t=>t===-1||t===56)&&p.tokens.some(t=>t===-1))pick=6;
    if(pick){S.phase='choose';chooseValue(pick);return;}
  }
  doRoll();
}

/* ---------- rendering ---------- */
const board=$('board'),tokLayer=$('tokens'),trackCells=[],tokEls=[];
const CORNER={0:'tl',1:'tr',2:'br',3:'bl'};
const STAR='<svg class="star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>';
const PIP={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const PIP_XY=[[6,6],[15,6],[24,6],[6,15],[15,15],[24,15],[6,24],[15,24],[24,24]];
const pips=v=>v?`<svg class="pips" viewBox="0 0 30 30">${PIP[v].map(k=>`<circle cx="${PIP_XY[k][0]}" cy="${PIP_XY[k][1]}" r="3.6"/>`).join('')}</svg>`:'';

// small 3D die (board item + bubble)
const DIE_SVG=`<svg viewBox="0 0 40 40"><rect x="4" y="6" width="32" height="31" rx="8" fill="#b9c4d8"/>
 <rect x="4" y="3" width="32" height="31" rx="8" fill="url(#dieFace)" stroke="#c9d3e3" stroke-width="1"/>
 <g fill="#25337a"><circle cx="12.5" cy="11" r="3"/><circle cx="27.5" cy="11" r="3"/><circle cx="20" cy="18.5" r="3"/><circle cx="12.5" cy="26" r="3"/><circle cx="27.5" cy="26" r="3"/></g></svg>`;
// golden picket fence
const FENCE_PICKETS=`<g stroke="#d9480f" stroke-width="2.2" stroke-linejoin="round">
 <rect x="3" y="14" width="34" height="5.5" rx="1.5" fill="#ffc21a"/><rect x="3" y="25" width="34" height="5.5" rx="1.5" fill="#ffc21a"/>
 ${[5,13.5,22,30.5].map(x=>`<path d="M${x} 35V12l2.75-4.5L${x+5.5} 12v23z" fill="url(#fenceWood)"/>`).join('')}</g>`;
const FENCE_SVG=`<svg viewBox="0 0 40 40">${FENCE_PICKETS}</svg>`;
// orange tile used under board items
const TILE=inner=>`<svg viewBox="0 0 40 40"><rect x="2" y="4" width="36" height="35" rx="8" fill="#c95a0a"/>
 <rect x="2" y="1.5" width="36" height="35" rx="8" fill="url(#tileFill)" stroke="#ffe08a" stroke-width="1.6"/>${inner}</svg>`;
const FENCE_TILE=TILE(`<g transform="translate(5 4) scale(.75)">${FENCE_PICKETS}</g>`);
const PLUS_TILE=TILE(`<text x="20" y="25.5" text-anchor="middle" font-size="15" font-weight="900" font-family="ui-rounded,system-ui,sans-serif"
  textLength="22" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#b44a00" stroke-width="2.6" paint-order="stroke">+1</text>`);
const PERSON='<svg viewBox="0 0 40 40"><circle cx="20" cy="13" r="8.5" fill="#fff"/><path d="M3 40c0-10 7.6-16 17-16s17 6 17 16z" fill="#fff"/></svg>';
const ARROW='<svg viewBox="0 0 40 48"><path d="M12 2h16v20h10L20 46 2 22h10z" fill="url(#arrowFill)" stroke="#e07000" stroke-width="2.5" stroke-linejoin="round"/><path d="M15 5h5v19" stroke="#fff8" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>';
const PAWN=c=>`<svg viewBox="0 0 60 80">
 <ellipse cx="30" cy="68" rx="28" ry="8.5" fill="#0006"/>
 <path d="M2 61v5c0 5 12.5 9 28 9s28-4 28-9v-5z" fill="url(#pd-${c})"/>
 <ellipse cx="30" cy="61" rx="28" ry="9.5" fill="url(#pb-${c})"/>
 <ellipse cx="30" cy="61" rx="24" ry="7.5" fill="#ffffff26"/>
 <path d="M7 59c0-12 10-17 13-27h20c3 10 13 15 13 27 0 4-10 6.5-23 6.5S7 63 7 59z" fill="url(#pb-${c})"/>
 <ellipse cx="30" cy="32" rx="13" ry="4.2" fill="url(#pd-${c})"/>
 <circle cx="30" cy="18" r="17" fill="url(#ph-${c})"/>
 <ellipse cx="23" cy="10.5" rx="7" ry="4.8" fill="#fff" opacity=".9"/>
 <path d="M13 56c1.5-8 5.5-13 9-21" stroke="#fff" stroke-width="3.2" stroke-linecap="round" fill="none" opacity=".5"/></svg>`;
const CENTER_SVG=c=>{const t=(pts,col,inner)=>`<polygon points="${pts}" fill="${col}"/><polygon points="${inner}" fill="none" stroke="#ffffff70" stroke-width="5" stroke-linejoin="round"/>`;
  return `<svg viewBox="0 0 300 300">
  ${t('0,0 150,150 0,300',COLORS[0].path,'30,60 110,150 30,240')}
  ${t('0,0 300,0 150,150',COLORS[1].path,'60,30 240,30 150,110')}
  ${t('300,0 300,300 150,150',COLORS[2].path,'270,60 270,240 190,150')}
  ${t('0,300 150,150 300,300',COLORS[3].path,'60,270 150,190 240,270')}</svg>`;};

function buildDefs(){
  let d=`<linearGradient id="dieFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e3e9f2"/></linearGradient>
   <linearGradient id="fenceWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff27a"/><stop offset="1" stop-color="#ffc312"/></linearGradient>
   <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb43a"/><stop offset="1" stop-color="#ff8a12"/></linearGradient>
   <linearGradient id="arrowFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff59a"/><stop offset="1" stop-color="#ffb300"/></linearGradient>`;
  COLORS.forEach((c,i)=>{const[l,m,k]=c.pawn;
    d+=`<linearGradient id="pb-${i}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${l}"/><stop offset=".45" stop-color="${m}"/><stop offset="1" stop-color="${k}"/></linearGradient>
     <linearGradient id="pd-${i}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${m}"/><stop offset="1" stop-color="${k}"/></linearGradient>
     <radialGradient id="ph-${i}" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="${l}"/><stop offset=".45" stop-color="${m}"/><stop offset="1" stop-color="${k}"/></radialGradient>`;});
  $('defs').innerHTML=d;
}

// VR = number of clockwise quarter turns applied to the whole board view
let VR=0;
const rotRC=(r,c)=>{for(let k=0;k<VR;k++)[r,c]=[c,14-r];return[r,c];};
const rotXY=(x,y)=>{for(let k=0;k<VR;k++)[x,y]=[15-y,x];return[x,y];};
const SCREEN=['tl','tr','br','bl'];
const screenCorner=c=>SCREEN[(c+VR)%4];          // colour c sits in this screen corner
const yardScreen=c=>{let[x,y]=YARD[c];for(let k=0;k<VR;k++)[x,y]=[9-y,x];return[x,y];};
function pickView(){
  let me=null;
  if(ONLINE)me=S.players.find(p=>p.uid===ONLINE.myId);
  if(!me)me=S.players.find(p=>p.type==='human');
  VR=me?(3-me.color+4)%4:0;
}
function buildBoard(){
  pickView();
  board.innerHTML='';tokLayer.innerHTML='';trackCells.length=0;tokEls.length=0;
  const add=(cls,css,html='')=>{const d=document.createElement('div');d.className=cls;d.style.cssText=css;d.innerHTML=html;board.appendChild(d);return d;};
  add('isl','grid-row:1/span 15;grid-column:7/span 3');
  add('isl','grid-row:7/span 3;grid-column:1/span 15');
  YARD.forEach((_,c)=>{const C=COLORS[c],p=S.players.find(q=>q.color===c),[x,y]=yardScreen(c);
    add('isl yard',`grid-row:${y+1}/span 6;grid-column:${x+1}/span 6;--y1:${C.y1};--y2:${C.y2};--yd:${C.yd};--yh:${C.yh}`,
      `<div class="nest" id="nest${c}"><b></b><b></b><b></b><b></b></div>${p?`<div class="lbl ${y===0?'flip':''}">${esc(p.name)}</div>`:''}`);});
  TRACK.forEach(([r0,c0],idx)=>{const[r,c]=rotRC(r0,c0);

let lastFx=null;
function playFx(fx){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(!document.body.animate)return;
  const from=trackCells[fx.idx];if(!from)return;
  const a=from.getBoundingClientRect();
  let target=fx.kind==='plus'?$('nest'+S.players[fx.pi].color):document.querySelector(`[data-bub="${fx.kind}-${fx.pi}"]`);
  if(!target||target.closest('.hidden'))target=document.querySelector(`[data-ava="${fx.pi}"]`);
  if(!target)return;
  const b=target.getBoundingClientRect();
  const el=document.createElement('div');el.className='fly';
  el.innerHTML=fx.kind==='dice'?DIE_SVG:fx.kind==='fence'?FENCE_TILE:PLUS_TILE;
  const size=a.width*1.3;
  Object.assign(el.style,{left:(a.left+a.width/2-size/2)+'px',top:(a.top+a.height/2-size/2)+'px',width:size+'px',height:size+'px'});
  document.body.appendChild(el);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);

    {transform:`translate(${dx}px,${dy}px) scale(${end})`,opacity:fx.kind==='plus'?1:.3}],
    {duration:350,easing:'cubic-bezier(.4,0,.3,1)'}).onfinish=()=>{
      el.remove();
      if(fx.kind==='plus'){const t=document.createElement('div');t.className='plusPop';t.textContent='+1';
        Object.assign(t.style,{left:(b.left+b.width/2)+'px',top:(b.top+b.height/2)+'px'});document.body.appendChild(t);
        setTimeout(()=>t.remove(),1100);}
      else{const n=document.querySelector(`[data-bub="${fx.kind}-${fx.pi}"]`)||document.querySelector(`[data-ava="${fx.pi}"]`);
        if(n){n.classList.remove('bump');void n.offsetWidth;n.classList.add('bump');}}};
}
/* ---------- throwables ---------- */
const THROWS=[{k:'coconut',e:'🥥',name:'Coconut'},{k:'cactus',e:'🌵',name:'Cactus'},{k:'tomato',e:'🍅',name:'Tomato'},
  {k:'bomb',e:'💣',name:'Bomb'},{k:'heart',e:'❤️',name:'Heart'},{k:'kiss',e:'😘',name:'Kiss'}];
let trayFor=null,emotePick=null,soundOn=true;const avaFx={};
try{soundOn=localStorage.getItem('ludoSound')!=='off';}catch(e){}
const canThrow=pi=>S&&S.phase!=='over'&&S.players[pi].type==='human'&&(ONLINE?S.players[pi].uid===ONLINE.myId:true)&&S.players.length>1;
function toggleTray(pi){trayFor=trayFor===pi?null:pi;emotePick=null;draw();}
function pickThrow(from,k){trayFor=null;
  const foes=S.players.map((_,i)=>i).filter(i=>i!==from);
  if(foes.length===1){sendThrow(from,foes[0],k);emotePick=null;draw();}
  else{emotePick={from,k};draw();}}
function tapAva(pi){if(!emotePick||pi===emotePick.from)return;const{from,k}=emotePick;emotePick=null;draw();sendThrow(from,pi,k);}
function sendThrow(from,to,k){
  if(ONLINE)ONLINE.ref.child('throws').push({from,to,k,t:Date.now(),by:ONLINE.myId});
  playThrow(from,to,k);
  // the computer sometimes throws something back
  if(S.players[to].type==='cpu'&&Math.random()<.45)setTimeout(()=>{if(S)playThrow(to,from,THROWS[Math.floor(Math.random()*THROWS.length)].k);},1500);
}
function playThrow(from,to,k){
  const a=document.querySelector(`[data-ava="${from}"]`),b=document.querySelector(`[data-ava="${to}"]`);if(!a||!b)return;
  const A=a.getBoundingClientRect(),B=b.getBoundingClientRect(),t=THROWS.find(x=>x.k===k)||THROWS[0];
  const el=document.createElement('div');el.className='proj';el.textContent=t.e;
  Object.assign(el.style,{left:A.left+A.width/2+'px',top:A.top+A.height/2+'px'});document.body.appendChild(el);
  const dx=B.left+B.width/2-(A.left+A.width/2),dy=B.top+B.height/2-(A.top+A.height/2);
  const spin=k==='heart'||k==='kiss'?0:720,lift=Math.max(90,Math.abs(dx)*.35);

    {transform:`translate(calc(-50% + ${dx/2}px),calc(-50% + ${dy/2-lift}px)) rotate(${spin/2}deg) scale(1.5)`,offset:.5},
    {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) rotate(${spin}deg) scale(1.1)`}],
    {duration:420,easing:'cubic-bezier(.35,0,.65,1)'}).onfinish=done;
}
function impact(to,k){

  const cx=B.left+B.width/2,cy=B.top+B.height/2;

    const ang=Math.random()*Math.PI*2,d=spread*(.5+Math.random()*.6);
    s.style.left=cx+'px';s.style.top=cy+'px';s.style.setProperty('--dx',Math.cos(ang)*d+'px');s.style.setProperty('--dy',Math.sin(ang)*d-(cls==='rise'?50:0)+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1300);}};
  const mark=(cls,ms)=>{avaFx[to]={cls,until:Date.now()+ms};b.classList.remove(cls);void b.offsetWidth;b.classList.add(cls);
    setTimeout(()=>{const n=document.querySelector(`[data-ava="${to}"]`);if(n)n.classList.remove(cls);},ms);};

    Object.assign(sp.style,{left:B.left-6+'px',top:B.top-6+'px',width:B.width+12+'px',height:B.height+12+'px'});document.body.appendChild(sp);setTimeout(()=>sp.remove(),1600);sfx('tomato');}

  if(kind==='coconut'){tone(210,0,.18,'sine',.8,120);tone(190,.22,.18,'sine',.8,110);noise(0,.06,.4,2500);}       // dum dum
  if(kind==='cactus'){[0,.17,.34].forEach(d=>{tone(160,d,.16,'sine',.9,55);noise(d,.05,.35,1200,1.5);});} // dham dham dham
  if(kind==='tomato'){noise(0,.3,.7,500,.6);tone(140,0,.2,'sine',.4,60);}

    <h2>Players</h2><div class="seg">${[2,3,4].map(n=>`<button class="${cfg.n===n?'sel':''}" data-n="${n}">${n}</button>`).join('')}</div>
    <h2>Who's playing</h2>${cols.map(c=>`<div class="seat"><i style="background:${COLORS[c].css}"></i>
      <input data-c="${c}" placeholder="${COLORS[c].name}" value="${esc(cfg.seats[c].name)}" maxlength="12">
      <button data-t="${c}">${cfg.seats[c].type==='human'?'👤 Human':'🤖 Computer'}</button></div>`).join('')}
    <h2>Items</h2><label class="tog"><input type="checkbox" id="itm" ${cfg.items?'checked':''}> Dice, fences and +1 on the board</label>
    <button class="start" id="go">Start game</button></div>`;
    ov.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{cfg.n=+b.dataset.n;draw();});
    ov.querySelectorAll('[data-c]').forEach(i=>i.oninput=()=>cfg.seats[i.dataset.c].name=i.value);
    ov.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const s=cfg.seats[b.dataset.t];s.type=s.type==='human'?'cpu':'human';draw();});
    ov.querySelector('#itm').onchange=e=>cfg.items=e.target.checked;
    ov.querySelector('#go').onclick=()=>{ov.remove();cfg.seats.forEach(x=>x.uid=null);newGame();};
    ov.querySelector('#goOnline').onclick=()=>{ov.remove();showOnline();};
  };
  draw();document.body.appendChild(ov);
}
function showWin(){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="card"><h1>${esc(S.players[S.winners[0]].name)} wins!</h1>
   ${S.winners.map((pi,k)=>`<div class="rank"><b>${k+1}.</b><i style="background:${COLORS[S.players[pi].color].css}"></i>${esc(S.players[pi].name)}</div>`).join('')}
   ${ONLINE&&!ONLINE.isHost?'<p>Waiting for the host to start a rematch.</p><button class="start" id="lv">Leave room</button>':
     `<button class="start" id="again">${ONLINE?'Rematch':'Play again'}</button>`}</div>`;
  ov.id='winov';winShownFor=S.gameId;
  const a=ov.querySelector('#again'),l=ov.querySelector('#lv');
  if(a)a.onclick=()=>{ov.remove();if(ONLINE)newGame();else showSetup();};
  if(l)l.onclick=()=>{ov.remove();leaveRoom();showSetup();};
  document.body.appendChild(ov);
}

/* ---------- online rooms (Firebase Realtime Database) ----------
   Room layout:  rooms/CODE/meta   {n, items, host}
                 rooms/CODE/seats  {colour: {type:'host'|'friend'|'cpu', name, uid}}
                 rooms/CODE/state  {json, writer}   <- whole game state as a JSON string
   Whoever makes a move runs the rules on their phone and writes the new state; everyone else just draws it. */
let ONLINE=null,applyingRemote=false,winShownFor=null,db=null,myName='';
const myId=Math.random().toString(36).slice(2,10);
function fbReady(){
  if(typeof firebase==='undefined')return 'Could not load Firebase. Check your internet connection.';
  if(!FIREBASE_CONFIG.databaseURL||FIREBASE_CONFIG.databaseURL.includes('PASTE'))return 'Online play needs your Firebase settings. Paste them into FIREBASE_CONFIG at the top of the file.';
  if(!db){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();}
  return null;
}
function pushState(){
  if(!ONLINE||!S)return;
  S.seq=(S.seq||0)+1;
  ONLINE.ref.child('state').set({json:JSON.stringify(S),writer:myId});
}
/* ---------- chat (online games only) ---------- */
const QUICK=['Nice move! 👍','😂😂','Hurry up! ⏳','Oops 😅','Good game 🤝','Not fair! 😤'];
let unread=0;
function chatVisible(on){$('chatBtn').style.display=on?'':'none';if(!on){closeChat();$('clog').innerHTML='';unread=0;badge();}}
function badge(){const b=$('chatBadge');b.textContent=unread>9?'9+':unread||'';b.style.display=unread?'':'none';}
function openChat(){$('chat').hidden=false;unread=0;badge();$('clog').scrollTop=1e6;}
function closeChat(){$('chat').hidden=true;}
function sendChat(text){
  text=(text??$('ctext').value).trim().slice(0,120);if(!text||!ONLINE||!S)return;
  const me=S.players.find(p=>p.uid===ONLINE.myId);
  ONLINE.ref.child('chat').push({by:myId,name:me?me.name:myName,color:me?me.color:3,text,t:Date.now()});
  $('ctext').value='';
}
function showChat(v){
  const row=document.createElement('div');row.className='cm'+(v.by===myId?' mine':'');
  row.innerHTML=`<span style="color:${COLORS[v.color]?COLORS[v.color].css:'#888'}">${esc(v.name)}</span>${esc(v.text)}`;
  $('clog').appendChild(row);$('clog').scrollTop=1e6;
  if($('chat').hidden&&v.by!==myId){unread++;badge();}
  // a speech bubble also pops up next to the sender's avatar
  const pi=S?S.players.findIndex(p=>p.uid===v.by):-1,a=document.querySelector(`[data-ava="${pi}"]`);
  if(a&&v.by!==myId){const r=a.getBoundingClientRect(),sp=document.createElement('div');sp.className='speech';sp.textContent=v.text;
    const top=r.top<innerHeight/2;Object.assign(sp.style,{left:Math.min(Math.max(r.left+r.width/2,90),innerWidth-90)+'px',
      top:(top?r.bottom+8:r.top-8)+'px',transform:`translate(-50%,${top?'0':'-100%'})`});
    document.body.appendChild(sp);setTimeout(()=>sp.remove(),3500);sfx('heart');}
}
function listenChat(ref){
  $('clog').innerHTML='';unread=0;badge();chatVisible(true);
  const since=Date.now()-60*60*1000;   // show the last hour of messages in this room
  ref.child('chat').on('child_added',snap=>{const v=snap.val();if(v&&v.t>since)showChat(v);});
}
function listenThrows(ref){
  const since=Date.now()-1000;
  ref.child('throws').on('child_added',snap=>{const v=snap.val();
    if(!v||v.by===myId||v.t<since||!S)return;playThrow(v.from,v.to,v.k);});
}
function leaveRoom(){
  if(!ONLINE)return;
  ONLINE.ref.child('state').off();ONLINE.ref.child('seats').off();ONLINE.ref.child('throws').off();ONLINE.ref.child('chat').off();chatVisible(false);
  ONLINE=null;
}
function onRemoteState(snap){
  const v=snap.val();if(!v||v.writer===myId)return;
  const next=JSON.parse(v.json),fresh=!S||S.gameId!==next.gameId;
  if(!fresh&&(next.seq||0)<=(S.seq||0))return;   // stale copy: ignore it
  document.querySelectorAll('#online,#winov').forEach(o=>{if(fresh||o.id==='online')o.remove();});
  applyingRemote=true;S=next;if(fresh)buildBoard();render();applyingRemote=false;
  if(S.phase==='over'&&winShownFor!==S.gameId)showWin();
}
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode=()=>[...Array(4)].map(()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');

function showOnline(){
  const ov=document.createElement('div');ov.className='ov';ov.id='online';
  const err=fbReady();
  const host={n:2,items:true,seats:{3:'host',0:'friend',1:'friend',2:'friend'}};
  const card=html=>{ov.innerHTML=`<div class="card">${html}</div>`;};
  const back=()=>{ov.remove();leaveRoom();showSetup();};

  function home(){
    card(`<h1>Play online</h1>
      <p>One person creates a room and shares the code. Everyone else joins with that code.</p>
      ${err?`<p style="color:#d33;margin-top:10px">${esc(err)}</p>`:''}
      <h2>Your name</h2><div class="seat"><input id="nm" maxlength="12" placeholder="Name" value="${esc(myName)}"></div>
      <button class="start" id="mk" ${err?'disabled':''}>Create a room</button>
      <h2>Join a friend</h2><div class="seat"><input id="cd" maxlength="4" placeholder="Room code" style="text-transform:uppercase;letter-spacing:3px">
      <button id="jn" ${err?'disabled':''}>Join</button></div>
      <p id="jerr" style="color:#d33"></p>
      <button class="x" id="bk" style="margin-top:10px;color:var(--cardMuted);font-weight:700">Back</button>`);
    ov.querySelector('#nm').oninput=e=>myName=e.target.value.trim();
    ov.querySelector('#bk').onclick=back;
    ov.querySelector('#mk').onclick=()=>{if(!myName)return ov.querySelector('#nm').focus();hostSetup();};
    ov.querySelector('#jn').onclick=()=>{if(!myName)return ov.querySelector('#nm').focus();join(ov.querySelector('#cd').value.trim().toUpperCase());};
  }

  function hostSetup(){
    const cols=seatColors(host.n);
    if(!cols.some(k=>host.seats[k]==='host'))host.seats[cols[0]]='host';
    const label={host:'👤 You',friend:'🌐 Friend',cpu:'🤖 Computer'};
    card(`<h1>New room</h1>
      <h2>Players</h2><div class="seg">${[2,3,4].map(n=>`<button class="${host.n===n?'sel':''}" data-n="${n}">${n}</button>`).join('')}</div>
      <h2>Seats</h2><p style="margin-bottom:8px">Tap a seat to switch between you, a friend and the computer.</p>
      ${cols.map(c=>`<div class="seat"><i style="background:${COLORS[c].css}"></i><span style="flex:1">${COLORS[c].name}</span>
        <button data-s="${c}">${label[host.seats[c]]}</button></div>`).join('')}
      <h2>Items</h2><label class="tog"><input type="checkbox" id="itm" ${host.items?'checked':''}> Dice, fences and +1 on the board</label>
      <button class="start" id="create">Create room</button>
      <button class="x" id="bk" style="margin-top:10px;color:var(--cardMuted);font-weight:700">Back</button>`);
    ov.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{host.n=+b.dataset.n;hostSetup();});
    ov.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const c=b.dataset.s,order=['host','friend','cpu'];
      let t=order[(order.indexOf(host.seats[c])+1)%3];
      if(t==='host')Object.keys(host.seats).forEach(k=>{if(host.seats[k]==='host')host.seats[k]='friend';});
      host.seats[c]=t;
      if(!seatColors(host.n).some(k=>host.seats[k]==='host'))host.seats[c]='host';
      hostSetup();});
    ov.querySelector('#itm').onchange=e=>host.items=e.target.checked;
    ov.querySelector('#bk').onclick=home;
    ov.querySelector('#create').onclick=createRoom;
  }

  async function createRoom(){
    let code,ref;
    for(let i=0;i<8;i++){code=newCode();ref=db.ref('rooms/'+code);if(!(await ref.child('meta').get()).exists())break;}
    const seats={};
    seatColors(host.n).forEach(c=>{const t=host.seats[c];
      seats[c]={type:t,name:t==='host'?myName:t==='cpu'?COLORS[c].name:'',uid:t==='host'?myId:''};});
    await ref.set({meta:{n:host.n,items:host.items,host:myId,created:Date.now()},seats});
    ONLINE={code,ref,myId,isHost:true};
    ref.child('state').on('value',onRemoteState);listenThrows(ref);listenChat(ref);
    ref.child('seats').on('value',snap=>lobby(snap.val()||{}));
  }

  async function join(code){
    const jerr=ov.querySelector('#jerr');
    if(code.length!==4){jerr.textContent='Room codes have 4 characters.';return;}
    const ref=db.ref('rooms/'+code);
    const meta=(await ref.child('meta').get()).val();
    if(!meta){jerr.textContent='No room with code '+code+'. Check the code with your friend.';return;}
    let mySeat=null;
    const res=await ref.child('seats').transaction(seats=>{
      if(!seats)return seats;mySeat=null;
      for(const c of Object.keys(seats)){if(seats[c].uid===myId){mySeat=c;return seats;}}
      for(const c of Object.keys(seats)){if(seats[c].type==='friend'&&!seats[c].uid){seats[c].uid=myId;seats[c].name=myName;mySeat=c;return seats;}}
      return;});
    if(!res.committed||mySeat===null){jerr.textContent='This room is full or the game has already started.';return;}
    ONLINE={code,ref,myId,isHost:false};
    ref.child('state').on('value',onRemoteState);listenThrows(ref);listenChat(ref);
    ref.child('seats').on('value',snap=>lobby(snap.val()||{}));
  }

  function lobby(seats){
    if(!ONLINE||!document.getElementById('online'))return;
    const cols=Object.keys(seats).map(Number).sort();
    const ready=cols.every(c=>seats[c].type==='cpu'||seats[c].uid);
    const share=`Join my Ludo Talent game with code ${ONLINE.code}: ${location.href.split('#')[0]}`;
    card(`<h1>Room ${ONLINE.code}</h1>
      <p>${ONLINE.isHost?'Send this code to your friends. Start when everyone has joined.':'You are in. Waiting for the host to start the game.'}</p>
      ${ONLINE.isHost?`<button class="start" id="sh" style="background:var(--blue);box-shadow:0 4px 0 var(--blueD)">Share code</button>`:''}
      <h2>Players</h2>
      ${cols.map(c=>{const s=seats[c];const who=s.type==='cpu'?'🤖 Computer':s.uid?esc(s.name)+(s.uid===myId?' (you)':''):'Waiting to join…';
        return `<div class="seat"><i style="background:${COLORS[c].css}"></i><span style="flex:1">${who}</span></div>`;}).join('')}
      ${ONLINE.isHost?`<button class="start" id="st" ${ready?'':'disabled style="opacity:.5"'}>Start game</button>`:''}
      <button class="x" id="bk" style="margin-top:10px;color:var(--cardMuted);font-weight:700">Leave room</button>`);
    ov.querySelector('#bk').onclick=back;
    const sh=ov.querySelector('#sh');
    if(sh)sh.onclick=async()=>{try{if(navigator.share)await navigator.share({text:share});else{await navigator.clipboard.writeText(share);sh.textContent='Copied';}}catch(e){}};
    const st=ov.querySelector('#st');
    if(st&&ready)st.onclick=async()=>{
      const meta=(await ONLINE.ref.child('meta').get()).val();
      cfg.n=meta.n;cfg.items=meta.items;
      cfg.seats=[0,1,2,3].map(c=>seats[c]?{name:seats[c].name||COLORS[c].name,type:seats[c].type==='cpu'?'cpu':'human',uid:seats[c].uid||null}:{name:'',type:'human',uid:null});
      ov.remove();newGame();};
  }
  home();document.body.appendChild(ov);
}

function toMenu(){if(document.getElementById('setup')||document.getElementById('online'))return;
  if(S&&S.phase!=='over'&&!document.getElementById('winov')&&!confirm('Leave this game?'))return;
  document.querySelectorAll('.ov').forEach(o=>o.remove());leaveRoom();showSetup();}
document.querySelector('#chat .quick').innerHTML=QUICK.map(q=>`<button onclick="sendChat(this.textContent)">${q}</button>`).join('');
$('ctext').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
$('chatBadge').style.display='none';
$('menu').onclick=toMenu;$('back').onclick=toMenu;
showSetup();
</script>
</body>
